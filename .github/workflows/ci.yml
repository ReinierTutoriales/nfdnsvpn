name: CI

on:
  push:
    branches:
      - main
      - 'fase-*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      # Rust core (native/nfdns-core); Gradle runs cargo with the NDK linkers.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/nfdns-core

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Rust tests
        working-directory: native/nfdns-core
        run: cargo test --locked

      # Real TUN in network namespaces: DNS, TCP and UDP through the userspace stack.
      - name: Tunnel end-to-end test
        run: |
          # A venv outside $HOME: the test servers run as root and the test clients as nobody.
          sudo python3 -m venv /opt/e2e-venv
          sudo /opt/e2e-venv/bin/pip install --quiet aioquic
          (cd native/nfdns-core && cargo build --locked --release --example linux_tun)
          sudo E2E_PYTHON=/opt/e2e-venv/bin/python TUNNEL_BIN="$PWD/native/nfdns-core/target/release/examples/linux_tun" scripts/e2e-linux.sh

      - name: Unit tests and lint
        run: ./gradlew testDebugUnitTest lintDebug --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Validate release build
        env:
          CI_SIGN_RELEASE_WITH_DEBUG_KEY: 'true'
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: reports
          path: app/build/reports/
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: nfdnsvpn-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
