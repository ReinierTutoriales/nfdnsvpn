name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      # Rust core (native/nfdns-core); Gradle runs cargo with the NDK linkers.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/nfdns-core

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # Code policy (CLAUDE.md): formatted, no clippy warnings, scripts clean.
      - name: Rust format and clippy
        working-directory: native/nfdns-core
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings

      - name: Shell scripts
        run: shellcheck -S warning scripts/*.sh .claude/hooks/*.sh

      - name: Rust tests
        working-directory: native/nfdns-core
        run: cargo test --locked

      # Real TUN in network namespaces: DNS, TCP and UDP through the userspace stack.
      - name: Tunnel end-to-end test
        run: |
          # A venv outside $HOME: the test servers run as root and the test clients as nobody.
          sudo python3 -m venv /opt/e2e-venv
          sudo /opt/e2e-venv/bin/pip install --quiet aioquic
          (cd native/nfdns-core && cargo build --locked --release --example linux_tun)
          sudo E2E_PYTHON=/opt/e2e-venv/bin/python TUNNEL_BIN="$PWD/native/nfdns-core/target/release/examples/linux_tun" scripts/e2e-linux.sh

      - name: Unit tests and lint
        run: ./gradlew testDebugUnitTest lintDebug --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      # Signed with the fixed release key when the repository has it as Actions secrets
      # (RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD);
      # otherwise only validated with the debug key.
      - name: Release build
        env:
          CI_SIGN_RELEASE_WITH_DEBUG_KEY: 'true'
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            export RELEASE_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RELEASE_KEYSTORE_PATH"
            echo "SIGNED_RELEASE=true" >> "$GITHUB_ENV"
          fi
          ./gradlew assembleRelease --stacktrace
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Upload signed release APK
        if: env.SIGNED_RELEASE == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: nfdnsvpn-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 90

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: reports
          path: app/build/reports/
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: nfdnsvpn-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
