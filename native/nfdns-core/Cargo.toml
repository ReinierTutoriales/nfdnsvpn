[package]
name = "nfdns-core"
version = "0.1.0"
edition = "2021"
publish = false
description = "Packet classifier and domain filter of the nfdnsvpn local VPN"
license = "MIT"

[lib]
name = "nfdns"
crate-type = ["cdylib", "rlib"]

[dependencies]
futures = "0.3"
jni = "0.22.4"
libc = "0.2"
netstack-smoltcp = "0.2.4"
tokio = { version = "1.53.2", features = ["rt", "net", "io-util", "time", "macros", "sync"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
